<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Remove Photos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Remove Ticked Photos</h1>
        <p class="text-center text-muted">
            Upload the PDF with the boxes ticked. Every ticked photo and the name below it will be removed.
        </p>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="{{ url_for('remove_upload') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Choose the ticked PDF file:</label>
                        <input class="form-control" type="file" id="file" name="file" accept=".pdf" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Remove Photos</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
